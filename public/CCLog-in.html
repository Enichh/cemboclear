<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CemboClear Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #0077c0 0%, #003366 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .login-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .brand-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 30px;
        }

        .logo-img {
            max-width: 80px;
            height: auto;
        }

        .brand-name {
            color: #0056b3;
            font-size: 32px;
            font-weight: 700;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-field {
            width: 100%;
            padding: 14px 20px;
            border: 1px solid #a0a0a0;
            border-radius: 12px;
            font-size: 16px;
            color: #333333;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field::placeholder {
            color: #8c8c8c;
        }

        .input-field:focus {
            border-color: #0056b3;
        }

        .signup-text {
            font-size: 14px;
            color: #555555;
            font-weight: 600;
            margin-top: 25px;
            margin-bottom: 25px;
        }

        .signup-link {
            color: #3da9fc;
            text-decoration: none;
            font-weight: 700;
        }

        .signup-link:hover {
            text-decoration: underline;
        }

        .btn-submit {
            background-color: #ffffff;
            color: #333333;
            border: 1px solid #8c8c8c;
            border-radius: 25px;
            padding: 12px 45px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.2s ease-in-out;
            margin-bottom: 40px;
        }

        .btn-submit:hover {
            background-color: #f5f5f5;
            border-color: #333333;
        }

        .divider {
            height: 1px;
            background-color: #7faed4;
            width: 100%;
            margin-bottom: 20px;
        }

        .footer-text {
            font-size: 13px;
            color: #444444;
            font-weight: 700;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="brand-header">
            <img class="logo-img" src="CClogo/myCC.png" alt=" ">
            <div class="brand-name">CemboClear</div>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <input type="text" class="input-field" placeholder="Email or Phone No." required>
            </div>

            <div class="input-group">
                <input type="password" class="input-field" placeholder="Password" required>
            </div>

            <div class="signup-text">
                Don’t have account? <a href="CCSignUp.html" class="signup-link">Create account</a>
            </div>

            <button type="submit" class="btn-submit">LOG-IN</button>
        </form>

        <div class="divider"></div>
        <div class="footer-text">
            Secure Access for Resident & Appointment Schedule
        </div>
    </div>

    <script>
        document.getElementById('loginForm')?.addEventListener('submit', function (e) {
            e.preventDefault();
            window.location.href = 'CCPages.html';
        });
    </script>

</body>

</html>
